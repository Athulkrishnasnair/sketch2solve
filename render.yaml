# Render Blueprint for Sketch2Solve
# https://render.com/docs/blueprint-spec

services:
  # 1. Backend Web Service (Flask + Gunicorn + Meta AI API)
  - type: web
    name: sketch2solve-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MODEL_BASE_URL
        value: https://api.meta.ai/v1
      - key: MODEL_NAME
        value: muse-spark-1.3
      - key: MODEL_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FLASK_DEBUG
        value: "0"

  # 2. Frontend Static Site (Vite + Vue 3)
  - type: web
    name: sketch2solve-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

